  <style>/* ── Brain Performance Coaching · base styles ─────────────────────── */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Default theme: Original Purple + Gold (from existing site) */
  --bg:        #F8F7FC;
  --paper:    #FFFFFF;
  --ink:      #1E1A2E;
  --muted:    #6B6880;
  --line:     rgba(95, 54, 133, 0.10);
  --line-2:   rgba(95, 54, 133, 0.20);
  --brand:    #5F3685;        /* signature purple */
  --brand-2:  #7B4BA8;        /* lighter purple */
  --accent:   #E8B84B;        /* gold */
  --accent-2: #F0CC73;
  --hover:   rgba(95, 54, 133, 0.06);

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --r-xl: 24px;

  --font-display: 'Instrument Serif', 'Times New Roman', serif;
  --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  --display-italic: italic;
}

/* Theme: Deep Violet — dark, logo-driven (purple dominates) */
[data-palette="deepviolet"] {
  --bg:      #1F1530;          /* deep violet canvas */
  --paper:   #2A1B43;          /* slightly raised surface */
  --ink:     #F3EEFB;          /* warm off-white text */
  --muted:   rgba(243, 238, 251, 0.62);
  --line:    rgba(243, 238, 251, 0.10);
  --line-2:  rgba(243, 238, 251, 0.20);
  --brand:   #B89BFF;          /* lavender for accents on dark */
  --brand-2: #8B6BE0;
  --accent:  #E8B84B;          /* gold — keeps brand pairing */
  --accent-2:#F0CC73;
  --hover:   rgba(243, 238, 251, 0.06);
}

/* Theme: Neuro Indigo + Sodium */
[data-palette="indigo"] {
  --bg:      #F2F3F7;
  --paper:   #FFFFFF;
  --ink:     #0F1729;
  --muted:   #5C6477;
  --line:    rgba(15, 23, 41, 0.10);
  --line-2:  rgba(15, 23, 41, 0.18);
  --brand:   #1B2C5C;
  --brand-2: #2B4A8E;
  --accent:  #E8A33F;
  --accent-2:#F2BD68;
}

/* Theme: Editorial — black + cream + single accent */
[data-palette="editorial"] {
  --bg:      #ECE7DC;
  --paper:   #F4EFE3;
  --ink:     #15110B;
  --muted:   #6E6657;
  --line:    rgba(21, 17, 11, 0.12);
  --line-2:  rgba(21, 17, 11, 0.22);
  --brand:   #15110B;
  --brand-2: #2A2418;
  --accent:  #C5421B;          /* single saturated accent */
  --accent-2:#E25E36;
}

/* ── Typography mode ─────────────────────────────────────────────── */
/* Default: Serif display + clean sans body */
[data-typo="sans"] {
  --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
  --display-italic: normal;
}

/* ── Base ────────────────────────────────────────────────────────── */
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--ink);
  font-weight: 400;
  line-height: 1.55;
  font-size: 16px;
  overflow-x: hidden;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
img { display: block; max-width: 100%; }

/* ── Typography utilities ────────────────────────────────────────── */
.display {
  font-family: var(--font-display);
  font-weight: 400;
  letter-spacing: -0.02em;
  line-height: 1.02;
}
[data-typo="sans"] .display {
  font-weight: 700;
  letter-spacing: -0.035em;
}
.display em, .display .em {
  font-style: var(--display-italic);
  color: var(--brand);
  font-weight: 400;
}
[data-typo="sans"] .display em, [data-typo="sans"] .display .em {
  font-weight: 400;
  font-style: normal;
  color: var(--brand);
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--brand);
  font-weight: 500;
}

.kicker {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

.lead {
  font-size: 19px;
  line-height: 1.6;
  color: var(--muted);
  max-width: 56ch;
}

.body { font-size: 16px; line-height: 1.7; color: var(--muted); }
.body strong { color: var(--ink); font-weight: 600; }

/* ── Layout primitives ───────────────────────────────────────────── */
.shell { max-width: 1280px; margin: 0 auto; padding: 0 56px; }
.shell-narrow { max-width: 920px; margin: 0 auto; padding: 0 56px; }
.section { padding: 120px 0; }
.section-tight { padding: 80px 0; }

@media (max-width: 900px) {
  .shell, .shell-narrow { padding: 0 24px; }
  .section { padding: 72px 0; }
  .section-tight { padding: 56px 0; }
}

.row-rule {
  height: 1px;
  background: var(--line);
}

/* ── Buttons ─────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-body);
  font-size: 14px; font-weight: 500;
  padding: 13px 22px;
  border-radius: 999px;
  text-decoration: none;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.18s ease;
  white-space: nowrap;
}
.btn-primary {
  background: var(--ink);
  color: var(--paper);
}
.btn-primary:hover { background: var(--brand); transform: translateY(-1px); }

.btn-accent {
  background: var(--accent);
  color: var(--ink);
  font-weight: 600;
}
.btn-accent:hover { background: var(--accent-2); transform: translateY(-1px); }

.btn-ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--line-2);
}
.btn-ghost:hover { border-color: var(--ink); background: var(--hover); }

.btn-lg { padding: 16px 28px; font-size: 15px; }
.btn-sm { padding: 9px 16px; font-size: 13px; }

.btn .arrow { display: inline-block; transition: transform 0.18s ease; }
.btn:hover .arrow { transform: translateX(3px); }

/* ── NAV ─────────────────────────────────────────────────────────── */
.nav {
  position: sticky; top: 0; z-index: 90;
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter: saturate(140%) blur(14px);
  border-bottom: 1px solid var(--line);
}
.nav-inner {
  max-width: 1280px; margin: 0 auto;
  padding: 18px 56px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 24px;
}
.nav-brand {
  display: inline-flex; align-items: baseline; gap: 10px;
  text-decoration: none; color: var(--ink);
}
.nav-mark {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--brand);
  color: var(--paper);
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: 18px;
  align-self: center;
}
.nav-mark-img {
  width: 40px; height: 40px;
  object-fit: contain;
  align-self: center;
}
.nav-name {
  font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
  white-space: nowrap;
}
.nav-name small {
  display: block; font-size: 10px; color: var(--muted); font-weight: 400;
  letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px;
  white-space: nowrap;
}
.nav-links { display: flex; gap: 6px; }
.nav-link {
  padding: 8px 14px;
  font-size: 14px;
  color: var(--ink);
  text-decoration: none;
  border-radius: 999px;
  transition: background 0.15s;
  cursor: pointer;
}
.nav-link:hover { background: var(--hover); }
.nav-link.active { background: var(--ink); color: var(--paper); }
.nav-cta { display: flex; align-items: center; gap: 10px; }

@media (max-width: 900px) {
  .nav-inner { padding: 14px 24px; }
  .nav-links { display: none; }
}
@media (max-width: 1180px) {
  .nav-name small { display: none; }
}
@media (max-width: 760px) {
  .nav-name { display: none !important; }
}
@media (max-width: 520px) {
  .nav-cta .btn { font-size: 13px; padding: 9px 14px; gap: 6px; }
  .nav-cta .btn .arrow { display: none; }
}

/* ── Hamburger button ────────────────────────────────────────────── */
.ham-btn {
  display: none;
  background: none;
  border: none;
  font-size: 24px;
  color: var(--ink);
  cursor: pointer;
  padding: 4px 8px;
  line-height: 1;
  margin-left: 6px;
}
@media (max-width: 900px) {
  .ham-btn { display: flex; align-items: center; }
}

/* ── Mobile slide-out menu ───────────────────────────────────────── */
.mob-menu {
  position: fixed;
  top: 0; right: -100%;
  width: min(300px, 85vw);
  height: 100vh;
  background: var(--paper);
  z-index: 300;
  display: flex; flex-direction: column;
  box-shadow: -4px 0 40px rgba(30,26,46,0.18);
  transition: right 0.32s cubic-bezier(.2,.7,.2,1);
  padding-top: 72px;
  overflow-y: auto;
}
.mob-menu.open { right: 0; }
.mob-menu-inner {
  padding: 8px 28px 32px;
  display: flex; flex-direction: column; gap: 0;
  flex: 1;
}
.mob-link {
  display: block;
  font-size: 19px; font-weight: 500;
  color: var(--ink);
  text-decoration: none;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
  transition: color 0.15s;
}
.mob-link:hover { color: var(--brand); }
.mob-link.active { color: var(--brand); font-weight: 600; }
.mob-menu-cta { margin-top: 28px; padding-top: 4px; }
.mob-overlay {
  position: fixed;
  inset: 0;
  background: rgba(30,26,46,0.45);
  z-index: 299;
  -webkit-tap-highlight-color: transparent;
}

/* ── Footer ──────────────────────────────────────────────────────── */
.footer {
  background: var(--ink);
  color: var(--paper);
  padding: 80px 0 40px;
}
.footer-inner {
  max-width: 1280px; margin: 0 auto; padding: 0 56px;
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr 1fr;
  gap: 56px;
}
.footer h4 {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: rgba(244, 241, 234, 0.4);
  margin-bottom: 20px;
}
.footer ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.footer a { color: rgba(244, 241, 234, 0.7); text-decoration: none; font-size: 14px; }
.footer a:hover { color: var(--paper); }
.footer-bot {
  max-width: 1280px; margin: 56px auto 0; padding: 24px 56px 0;
  border-top: 1px solid rgba(244, 241, 234, 0.1);
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; color: rgba(244, 241, 234, 0.4);
}
.footer-bot a { color: inherit; margin-left: 18px; }

@media (max-width: 900px) {
  .footer-inner { grid-template-columns: 1fr 1fr; padding: 0 24px; gap: 32px; }
  .footer-bot { flex-direction: column; gap: 12px; padding: 24px 24px 0; }
}
@media (max-width: 520px) {
  .footer-inner { grid-template-columns: 1fr; gap: 28px; }
  .footer { padding: 56px 0 32px; }
}

/* ── Page transitions ────────────────────────────────────────────── */
.page-enter { animation: pageIn 0.42s cubic-bezier(.2,.7,.2,1) both; }
@keyframes pageIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Pill / chip ─────────────────────────────────────────────────── */
.pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  border: 1px solid var(--line-2);
  border-radius: 999px;
  font-size: 12px;
  color: var(--ink);
  background: var(--paper);
}
.pill .dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
}

/* ── Reusable card ───────────────────────────────────────────────── */
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 32px;
  transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
}
.card:hover { border-color: var(--line-2); }

/* ── Scroll-marquee for sport disciplines ────────────────────────── */
.marquee {
  overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
}
.marquee-track {
  display: inline-flex; gap: 56px;
  animation: marquee 32s linear infinite;
  white-space: nowrap;
  font-family: var(--font-display);
  font-size: 36px;
  color: var(--muted);
  padding: 12px 0;
}
.marquee-track span { display: inline-flex; align-items: center; gap: 56px; }
.marquee-track .sep { color: var(--accent); font-style: normal; }
.marquee-track.fast { animation-duration: 22s; }
.marquee-track.dir-left  { animation: marquee 38s linear infinite; }
.marquee-track.dir-right { animation: marquee-rev 42s linear infinite; }

/* dual rows */
.marquee[data-variant="dual"] { padding: 6px 0; }
.marquee[data-variant="dual"] .marquee-track + .marquee-track {
  margin-top: 8px;
  opacity: 0.55;
  font-size: 0.78em;
}

/* pills */
.marquee[data-variant="pills"] .marquee-track {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  font-style: normal;
  letter-spacing: 0.02em;
  gap: 14px;
}
.marquee[data-variant="pills"] .marquee-pills { gap: 14px; }
.sport-pill {
  display: inline-flex; align-items: center;
  padding: 10px 20px;
  border: 1px solid var(--line-2);
  border-radius: 999px;
  background: var(--paper);
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 12px;
  font-weight: 600;
}
.sport-pill::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  margin-right: 10px;
  display: inline-block;
}

/* rotator */
.marquee[data-variant="rotator"] {
  mask-image: none;
  padding: 28px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.rotator-inner {
  display: flex; align-items: baseline; justify-content: center;
  gap: 20px;
  max-width: 1280px; margin: 0 auto; padding: 0 32px;
  font-family: var(--font-display);
}
.rotator-label {
  font-family: var(--font-body);
  font-size: 13px; letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  flex-shrink: 0;
}
.rotator-word-stage {
  position: relative;
  display: inline-block;
  min-height: 1.05em;
  flex: 1;
  text-align: left;
}
.rotator-word {
  position: absolute;
  left: 0; top: 0;
  font-size: clamp(40px, 6vw, 84px);
  line-height: 1.05;
  color: var(--brand);
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 0.5s ease, transform 0.5s ease;
  white-space: nowrap;
}
.rotator-word em { font-style: italic; }
.rotator-word.on { opacity: 1; transform: translateY(0); }
[data-typo="sans"] .rotator-word { font-family: var(--font-body); font-weight: 700; letter-spacing: -0.02em; }
[data-typo="sans"] .rotator-word em { font-style: normal; }

/* ticker */
.marquee[data-variant="ticker"] .marquee-track {
  font-family: var(--font-body);
  font-style: normal;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  gap: 32px;
}
.marquee[data-variant="ticker"] .marquee-track span { gap: 32px; }
.ticker-item {
  display: inline-flex !important;
  align-items: baseline;
  gap: 10px !important;
}
.ticker-num {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--accent);
  letter-spacing: 0.1em;
}
.ticker-name { color: var(--ink); }
.marquee[data-variant="ticker"] .sep { color: var(--line-2); opacity: 0.7; }

@keyframes marquee {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
@keyframes marquee-rev {
  from { transform: translateX(-50%); }
  to   { transform: translateX(0); }
}

/* ── Modal ───────────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(27, 20, 36, 0.5);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  animation: fadeIn 0.18s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--paper);
  border-radius: var(--r-lg);
  max-width: 540px; width: 100%;
  padding: 44px;
  position: relative;
  box-shadow: 0 32px 80px rgba(27,20,36,0.25);
  animation: modalIn 0.24s cubic-bezier(.2,.7,.2,1);
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(16px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-close {
  position: absolute; top: 16px; right: 16px;
  width: 36px; height: 36px;
  border-radius: 50%; border: 1px solid var(--line-2);
  background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink); font-size: 16px;
}
.modal-close:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }

}
.hero-portrait {
  aspect-ratio: 4/5;
  border-radius: var(--r-lg);
  overflow: hidden;
  position: relative;
  background: var(--brand);
}
.hero-portrait img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.hero-portrait::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 60%, rgba(30,26,46,0.35) 100%);
  pointer-events: none;
}
.hero-portrait-label {
  position: absolute;
  left: 24px; bottom: 24px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.92);
  background: rgba(30, 26, 46, 0.55);
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.18);
  backdrop-filter: blur(6px);
  z-index: 2;
}
.hero-portrait-frame {
  position: absolute;
  inset: 0;
  display: flex; align-items: center; justify-content: center;
}
.hero-portrait-frame .glyph {
  font-family: var(--font-display);
  font-size: 280px;
  font-style: italic;
  color: rgba(255,255,255,0.18);
  line-height: 1;
}

/* Hero variant: kinetic numbers */
.hero[data-variant="kinetic"] .hero-grid {
  grid-template-columns: 1fr;
  text-align: left;
  justify-items: start;
}
.hero[data-variant="kinetic"] .hero-h1 {
  font-size: clamp(60px, 10vw, 156px);
  letter-spacing: -0.04em;
  line-height: 0.94;
}
.hero[data-variant="kinetic"] .hero-h1 .num {
  display: inline-block;
  font-style: var(--display-italic);
  color: var(--accent);
  position: relative;
}
.hero[data-variant="kinetic"] .hero-h1 .num::after {
  content: attr(data-tag);
  position: absolute;
  top: -8px; right: -10px;
  transform: translateX(100%);
  font-family: var(--font-mono);
  font-size: 11px;
  font-style: normal;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
.hero[data-variant="kinetic"] .hero-sub {
  margin: 36px 0;
  font-size: 19px;
  max-width: 48ch;
}

.hero-cta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

.hero-eyebrow-row {
  display: inline-flex; align-items: center; gap: 14px;
  margin-bottom: 32px;
}
.hero-eyebrow-row::after {
  content: ''; width: 36px; height: 1px; background: var(--line-2);
}

@media (max-width: 900px) {
  .hero[data-variant="split"] .hero-grid { grid-template-columns: 1fr; text-align: left; }
  .hero[data-variant="split"] .hero-portrait { aspect-ratio: 1/1; max-width: 100%; }
}

/* HOME · Spec strip ───────────────────────────────────────────────── */
.spec-strip {
  background: var(--ink);
  color: var(--paper);
  padding: 36px 0;
}
.spec-strip-inner {
  max-width: 1280px; margin: 0 auto; padding: 0 56px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px;
}
.spec-item { display: flex; flex-direction: column; gap: 6px; }
.spec-num {
  font-family: var(--font-display);
  font-style: var(--display-italic);
  font-size: 56px;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--accent);
}
[data-typo="sans"] .spec-num { font-style: normal; font-weight: 700; }
.spec-label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(244,241,234,0.55);
}
@media (max-width: 900px) {
  .spec-strip-inner { grid-template-columns: 1fr 1fr; padding: 0 24px; gap: 24px; }
  .spec-num { font-size: 44px; }
}

/* HOME · Section heading layout */
.section-head {
  display: grid; grid-template-columns: 1fr 1.5fr; gap: 56px;
  margin-bottom: 64px; align-items: end;
}
.section-head h2 { font-size: clamp(32px, 4.4vw, 64px); }
.section-head .lead { margin-top: 16px; }
@media (max-width: 900px) {
  .section-head { grid-template-columns: 1fr; gap: 16px; margin-bottom: 40px; }
}

/* ABOUT · Bio ─────────────────────────────────────────────────────── */
.bio-grid {
  display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 80px;
  align-items: start;
}
.bio-photo {
  aspect-ratio: 4/5;
  border-radius: var(--r-lg);
  background: var(--brand);
  position: relative; overflow: hidden;
  border: 1px solid var(--line);
}
.bio-photo img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.bio-photo .placeholder {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: rgba(255,255,255,0.85);
  font-family: var(--font-display);
  font-style: italic;
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, var(--brand), var(--brand-2));
}
.bio-photo .placeholder .glyph { font-size: 200px; line-height: 1; }
.bio-photo .placeholder .label {
  margin-top: 8px;
  font-family: var(--font-mono);
  font-style: normal;
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.55);
}
.bio-list { display: flex; flex-direction: column; gap: 28px; }
.bio-paragraph { font-size: 18px; line-height: 1.7; color: var(--ink); }
.bio-paragraph .accent { color: var(--brand); font-style: italic; font-family: var(--font-display); font-size: 1.05em; }
.bio-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 28px 40px; margin-top: 24px; }
.bio-rowcap { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.bio-rowval { font-size: 15px; color: var(--ink); }

@media (max-width: 900px) {
  .bio-grid { grid-template-columns: 1fr; gap: 32px; }
  .bio-rows { grid-template-columns: 1fr; gap: 16px; }
}

/* ABOUT · Credentials timeline */
.timeline { display: flex; flex-direction: column; }
.timeline-row {
  display: grid; grid-template-columns: 120px 1fr;
  gap: 32px;
  padding: 28px 0;
  border-top: 1px solid var(--line);
}
.timeline-row:last-child { border-bottom: 1px solid var(--line); }
.timeline-year {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.04em;
}
.timeline-title { font-size: 20px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.01em; }
.timeline-body { font-size: 15px; color: var(--muted); line-height: 1.6; }

/* METHOD · The wheel ──────────────────────────────────────────────── */
.method-hero {
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  gap: 80px;
  align-items: center;
}
.method-hero h1 { font-size: clamp(40px, 6vw, 84px); }
@media (max-width: 900px) { .method-hero { grid-template-columns: 1fr; gap: 40px; } }

.wheel-stage {
  position: relative;
  aspect-ratio: 1/1;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 8px;
}
.wheel-stage svg { width: 100%; height: 100%; display: block; overflow: visible; }
.wheel-rotor {
  transform-origin: 200px 200px;
  animation: wheelSpinIn 1.4s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes wheelSpinIn {
  from { transform: rotate(-22deg) scale(0.94); opacity: 0; }
  to   { transform: rotate(0) scale(1); opacity: 1; }
}
.wheel-slice-g { cursor: pointer; }
.wheel-slice {
  transition: opacity 0.25s ease, filter 0.25s ease, d 0.35s cubic-bezier(.2,.8,.2,1);
  transform-origin: 200px 200px;
}
.wheel-slice-g:hover .wheel-slice { filter: brightness(1.08); }
.wheel-slice-g.active .wheel-slice { filter: brightness(1.06) drop-shadow(0 4px 14px rgba(0,0,0,0.18)); }
.wheel-slice-name {
  transition: font-size 0.25s ease;
}
.wheel-slice-g.active .wheel-slice-name { font-size: 17px !important; }

.wheel-detail {
  margin-top: 36px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 32px;
  min-height: 200px;
}
.wheel-detail-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.wheel-detail-dot { width: 12px; height: 12px; border-radius: 50%; }
.wheel-detail-cap { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.wheel-detail-title { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 14px; }
.wheel-detail-text { font-size: 16px; line-height: 1.7; color: var(--muted); }

/* METHOD · Editorial vertical (alt) */
.dim-list {
  display: flex; flex-direction: column;
}
.dim-row {
  display: grid;
  grid-template-columns: 60px 1fr 1fr 40px;
  gap: 32px;
  padding: 28px 0;
  border-top: 1px solid var(--line);
  align-items: center;
  cursor: pointer;
  transition: background 0.2s;
}
.dim-row:hover { background: var(--hover); padding-left: 12px; padding-right: 12px; }
.dim-row:last-child { border-bottom: 1px solid var(--line); }
.dim-num {
  font-family: var(--font-display);
  font-style: var(--display-italic);
  font-size: 36px;
  color: var(--accent);
  line-height: 1;
}
[data-typo="sans"] .dim-num { font-style: normal; font-weight: 700; color: var(--brand); }
.dim-name { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; }
.dim-summary { font-size: 14px; color: var(--muted); line-height: 1.5; }
.dim-arrow { font-size: 20px; color: var(--muted); justify-self: end; }
.dim-row:hover .dim-arrow { color: var(--brand); }

@media (max-width: 900px) {
  .dim-row { grid-template-columns: 40px 1fr 28px; }
  .dim-summary { grid-column: 2 / 4; }
}

/* SERVICES ────────────────────────────────────────────────────────── */
.svc-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
}
.svc-card {
  position: relative;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 36px;
  display: flex; flex-direction: column;
  min-height: 360px;
  transition: border-color 0.2s, transform 0.2s;
}
.svc-card:hover { border-color: var(--ink); transform: translateY(-2px); }
.svc-card.featured {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.svc-card.featured .svc-name { color: var(--paper); }
.svc-card.featured .svc-tag { color: var(--accent); }
.svc-card.featured .svc-desc { color: rgba(244,241,234,0.7); }
.svc-card.featured .svc-points li { border-color: rgba(244,241,234,0.12); color: rgba(244,241,234,0.85); }
.svc-card.featured .svc-meta-cap { color: rgba(244,241,234,0.45); }
.svc-card.featured .svc-meta-val { color: var(--paper); }

.svc-num {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--muted);
  margin-bottom: 16px;
}
.svc-card.featured .svc-num { color: rgba(244,241,234,0.4); }
.svc-tag {
  font-family: var(--font-display);
  font-style: var(--display-italic);
  color: var(--brand);
  font-size: 18px;
  margin-bottom: 6px;
}
[data-typo="sans"] .svc-tag { font-style: normal; font-weight: 500; font-size: 14px; }
.svc-name { font-size: 28px; font-weight: 600; letter-spacing: -0.015em; margin-bottom: 14px; }
.svc-desc { font-size: 15px; color: var(--muted); line-height: 1.7; margin-bottom: 24px; flex: 1; }
.svc-points { list-style: none; display: flex; flex-direction: column; }
.svc-points li {
  padding: 12px 0;
  border-top: 1px solid var(--line);
  font-size: 14px;
  color: var(--ink);
  display: flex; align-items: center; gap: 10px;
}
.svc-points li::before {
  content: '';
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}
.svc-meta {
  display: flex; gap: 24px;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}
.svc-card.featured .svc-meta { border-color: rgba(244,241,234,0.12); }
.svc-meta-cap { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.svc-meta-val { font-size: 14px; color: var(--ink); font-weight: 500; }

@media (max-width: 900px) { .svc-grid { grid-template-columns: 1fr; } }

/* RESULTS · Editorial wall ────────────────────────────────────────── */
.results-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: hidden;
  margin-bottom: 80px;
}
.results-stat {
  background: var(--paper);
  padding: 36px;
}
.results-stat-num {
  font-family: var(--font-display);
  font-style: var(--display-italic);
  font-size: 72px;
  color: var(--brand);
  line-height: 1;
  letter-spacing: -0.03em;
}
[data-typo="sans"] .results-stat-num { font-style: normal; font-weight: 700; }
.results-stat-label { font-size: 14px; color: var(--muted); margin-top: 12px; line-height: 1.5; }

.testi-wall {
  columns: 3;
  column-gap: 24px;
}
.testi-wall .testi-card { break-inside: avoid; margin-bottom: 24px; }

.testi-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 28px;
}
.testi-quote {
  font-family: var(--font-display);
  font-size: 20px;
  line-height: 1.4;
  color: var(--ink);
  margin: 12px 0 24px;
  letter-spacing: -0.005em;
}
[data-typo="sans"] .testi-quote { font-family: var(--font-body); font-size: 16px; line-height: 1.55; font-weight: 500; letter-spacing: -0.01em; }
.testi-quote::before { content: '“'; font-family: var(--font-display); color: var(--accent); margin-right: 4px; }
.testi-quote::after { content: '”'; font-family: var(--font-display); color: var(--accent); }
.testi-result {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--brand);
  border: 1px solid var(--line-2);
  padding: 5px 10px;
  border-radius: 999px;
}
.testi-author {
  display: flex; align-items: center; gap: 12px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}
.testi-avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  overflow: hidden;
  background: var(--brand);
  color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-weight: 600;
  flex-shrink: 0;
}
.testi-avatar img { width: 100%; height: 100%; object-fit: cover; }
.testi-name { font-size: 14px; font-weight: 600; }
.testi-sport { font-size: 12px; color: var(--muted); }

@media (max-width: 900px) { .testi-wall { columns: 1; } }
@media (min-width: 900px) and (max-width: 1200px) { .testi-wall { columns: 2; } }

/* RESULTS · Carousel (alt) */
.testi-carousel {
  position: relative; overflow: hidden;
}
.testi-track {
  display: flex; gap: 24px;
  transition: transform 0.5s cubic-bezier(.2,.7,.2,1);
}
.testi-track .testi-card {
  flex: 0 0 calc((100% - 48px) / 3);
  max-width: calc((100% - 48px) / 3);
}
.testi-controls { display: flex; gap: 8px; margin-top: 32px; align-items: center; }
.testi-ctrl {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--paper);
  border: 1px solid var(--line-2);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-body);
  transition: background 0.2s, border-color 0.2s;
}
.testi-ctrl:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.testi-prog {
  flex: 1;
  height: 1px;
  background: var(--line);
  margin-left: 16px;
  position: relative;
}
.testi-prog-bar {
  position: absolute; top: -1px; left: 0;
  height: 3px;
  background: var(--brand);
  transition: width 0.5s ease;
}

@media (max-width: 900px) {
  .testi-track .testi-card { flex: 0 0 100%; max-width: 100%; }
}

/* RESULTS · Results-first table */
.results-table {
  border-top: 1px solid var(--line);
}
.results-row {
  display: grid;
  grid-template-columns: 60px 1.5fr 1.4fr 2.2fr;
  gap: 32px;
  padding: 28px 0;
  border-bottom: 1px solid var(--line);
  align-items: center;
}
.results-row .ix { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.results-row .who { display: flex; align-items: center; gap: 12px; }
.results-row .athlete-name { font-size: 16px; font-weight: 600; }
.results-row .athlete-sport { font-size: 12px; color: var(--muted); }
.results-row .delta {
  display: inline-flex; align-items: baseline; gap: 8px;
  font-family: var(--font-display);
}
.results-row .delta .from { color: var(--muted); font-size: 18px; text-decoration: line-through; text-decoration-thickness: 1px; }
.results-row .delta .to { color: var(--brand); font-size: 28px; font-style: var(--display-italic); }
[data-typo="sans"] .results-row .delta .to { font-style: normal; font-weight: 700; }
.results-row .delta-label { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; display: block; margin-top: 4px; }
.results-row .quote {
  font-size: 14px; color: var(--muted); line-height: 1.6; font-style: italic;
}

@media (max-width: 900px) {
  .results-row { grid-template-columns: 1fr; gap: 12px; }
  .results-row .ix { display: none; }
}

/* CONTACT ─────────────────────────────────────────────────────────── */
.contact-grid {
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  gap: 80px;
  align-items: start;
}
.contact-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 40px;
}
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 22px; }
.field label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea {
  width: 100%;
  padding: 12px 0;
  border: none;
  border-bottom: 1px solid var(--line-2);
  background: transparent;
  font-family: var(--font-body);
  font-size: 16px;
  color: var(--ink);
  outline: none;
  transition: border-color 0.18s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-bottom-color: var(--brand); }
.field textarea { resize: vertical; min-height: 90px; }
.field input::placeholder, .field textarea::placeholder { color: rgba(107,99,120,0.5); }

.contact-meta { display: flex; flex-direction: column; gap: 24px; }
.contact-row { display: flex; align-items: flex-start; gap: 16px; padding: 20px 0; border-top: 1px solid var(--line); }
.contact-row:first-of-type { border-top: 1px solid var(--line); }
.contact-cap { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.contact-val { font-size: 16px; color: var(--ink); }
.contact-val a { color: var(--brand); text-decoration: none; }
.contact-val a:hover { text-decoration: underline; }
.social-row { display: flex; gap: 10px; }
.social-link {
  width: 40px; height: 40px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink);
  transition: background 0.18s, color 0.18s, border-color 0.18s;
}
.social-link:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.social-link svg { width: 16px; height: 16px; fill: currentColor; }

@media (max-width: 900px) {
  .contact-grid { grid-template-columns: 1fr; gap: 32px; }
  .contact-card { order: -1; }
}

/* CTA ─────────────────────────────────────────────────────────────── */
.cta-band {
  background: var(--ink);
  color: var(--paper);
  border-radius: var(--r-xl);
  padding: 80px 64px;
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  align-items: end;
  gap: 32px;
  margin: 80px 0 0;
}
.cta-band h2 {
  font-family: var(--font-display);
  font-size: clamp(36px, 5vw, 72px);
  letter-spacing: -0.02em;
  line-height: 1.05;
  color: var(--paper);
}
[data-typo="sans"] .cta-band h2 { font-weight: 700; }
.cta-band h2 em, .cta-band h2 .em { color: var(--accent); font-style: var(--display-italic); font-weight: 400; }

    display:flex;flex-direction:column;box-shadow:-1px 0 0 rgba(0,0,0,.1)}
  .twk-chip>span>i{flex:1;box-shadow:0 -1px 0 rgba(0,0,0,.1)}
  .twk-chip>span>i:first-child{box-shadow:none}
  .twk-chip svg{position:absolute;top:6px;left:6px;width:13px;height:13px;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
`;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // Hide the toggle until the host has actually enabled the rail (the
  // __omelette_rail_enabled window message, posted only when the
  // omelette_deck_rail_enabled flag is on for this user). The initial read
  // covers TweaksPanel mounting after the message already arrived; the
  // listener covers the common case of mounting first.
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

const SPORTS = [

'Cross Country', '400m', '800m', 'Track & Field', 'Pre-Olympic'];


function DisciplineMarquee({ variant = 'scroll' }) {
  // VARIANT 1 — smooth single-row scroll with ✦ separators (original)
  if (variant === 'scroll') {
    const node =

        {SPORTS.map((x, i) =>
      <React.Fragment key={i}>

        <div className="marquee-track dir-right">{row(bot)}{row(bot)}{row(bot)}</div>
      </div>);

    <span className="marquee-pills">
        {SPORTS.map((x, i) =>
      <span key={i} className="sport-pill">{x}</span>
      )}
      </span>;

    return (
      <div className="marquee" data-variant="pills">
        <div className="marquee-track">{node}{node}</div>
      </div>);

  }

  // VARIANT 4 — Rotator: one sport at a time, large editorial type
  if (variant === 'rotator') {
    const [idx, setIdx] = useState(0);

      const id = setInterval(() => setIdx((i) => (i + 1) % SPORTS.length), 1800);
      return () => clearInterval(id);
    }, []);
    return (
      <div className="marquee" data-variant="rotator">
        <div className="rotator-inner">
          <span className="rotator-label">Training brains across</span>
          <span className="rotator-word-stage">

            <span key={i} className={`rotator-word ${i === idx ? 'on' : ''}`}>
                <em>{x}</em>
              </span>
            )}
          </span>
        </div>
      </div>);

  }

  // VARIANT 5 — Ticker: faster, mono, numbered, brand-colored separators
  if (variant === 'ticker') {

            <span className="ticker-item">
              <span className="ticker-num">0{i % 9 + 1}</span>
              <span className="ticker-name">{x}</span>
            </span>
            <span className="sep">/</span>
          </React.Fragment>
      )}
      </span>;

    return (
      <div className="marquee" data-variant="ticker">
        <div className="marquee-track fast">{node}{node}</div>
      </div>);

// ─── 8-Dimension Wheel (interactive, original-style pie) ────────────
function Wheel({ dimensions, active, onSelect }) {
  const cx = 240,cy = 240;
  const rOuter = 142; // full pie radius
  const rInner = 50; // central hub radius
  const rLabel = rOuter + 36; // dimension names live OUTSIDE the rim
  const N = dimensions.length;

  function arcPath(i, r1, r0) {
    const a0 = i / N * Math.PI * 2 - Math.PI / 2;
    const a1 = (i + 1) / N * Math.PI * 2 - Math.PI / 2;
    const x0 = cx + r1 * Math.cos(a0),y0 = cy + r1 * Math.sin(a0);
    const x1 = cx + r1 * Math.cos(a1),y1 = cy + r1 * Math.sin(a1);
    const ix0 = cx + r0 * Math.cos(a0),iy0 = cy + r0 * Math.sin(a0);
    const ix1 = cx + r0 * Math.cos(a1),iy1 = cy + r0 * Math.sin(a1);
    return `M ${ix0} ${iy0} L ${x0} ${y0} A ${r1} ${r1} 0 0 1 ${x1} ${y1} L ${ix1} ${iy1} A ${r0} ${r0} 0 0 0 ${ix0} ${iy0} Z`;
  }

  function labelTransform(i, r) {
    const a = (i + 0.5) / N * Math.PI * 2 - Math.PI / 2;
    const x = cx + r * Math.cos(a);
    const y = cy + r * Math.sin(a);
    // rotate text along the radial direction so it reads outward, but flip on bottom half for legibility
    let deg = a * 180 / Math.PI;
    let flip = false;
    if (deg > 90 || deg < -90) {deg = deg + 180;flip = true;}
    return { x, y, deg, flip };
  }

  return (
    <div className="wheel-stage">
      <svg viewBox="0 0 480 480" className="wheel-svg">
        <defs>
          <filter id="wheelShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" floodOpacity="0.18" />
          </filter>
          {dimensions.map((d, i) =>
          <radialGradient key={`g-${d.id}`} id={`slice-${i}`} cx="50%" cy="50%" r="80%">
              <stop offset="0%" stopColor={d.color} stopOpacity="0.92" />
              <stop offset="100%" stopColor={d.color} stopOpacity="1" />
            </radialGradient>
          )}
        </defs>

        {/* outer ring shadow */}
        <circle cx={cx} cy={cy} r={rOuter + 4} fill="none" stroke="var(--line)" strokeWidth="1" />

        {/* slices */}
        <g filter="url(#wheelShadow)" className="wheel-rotor">
          {dimensions.map((d, i) => {
            const isActive = active === i;
            return (
              <g key={d.id}
              className={`wheel-slice-g ${isActive ? 'active' : ''}`}
              onClick={() => onSelect(i)}>
                <path
                  d={arcPath(i, isActive ? rOuter + 6 : rOuter, rInner)}
                  fill={`url(#slice-${i})`}
                  className="wheel-slice"
                  stroke="rgba(255,255,255,0.85)"
                  strokeWidth="1.5" />
                
              </g>);

          })}
        </g>

        {/* dimension names placed OUTSIDE the rim, horizontal */}
        {dimensions.map((d, i) => {
          const a = (i + 0.5) / N * Math.PI * 2 - Math.PI / 2;
          const x = cx + rLabel * Math.cos(a);
          const y = cy + rLabel * Math.sin(a);
          // anchor based on which side the label is on
          const cosA = Math.cos(a);
          let anchor = 'middle';
          if (cosA > 0.25) anchor = 'start';else
          if (cosA < -0.25) anchor = 'end';
          const isActive = active === i;
          return (
            <g key={`name-${d.id}`}
            className={`wheel-outside-label ${isActive ? 'active' : ''}`}
            onClick={() => onSelect(i)}
            style={{ cursor: 'pointer' }}>
              <text
                x={x} y={y - 6}
                textAnchor={anchor}
                dominantBaseline="middle"
                style={{
                  fontFamily: 'var(--font-mono)',
                  fontSize: 9,
                  fontWeight: 600,
                  letterSpacing: '0.18em',
                  textTransform: 'uppercase',
                  fill: isActive ? d.color : 'var(--muted)'
                }}>
                {`0${i + 1}`}
              </text>
              <text
                x={x} y={y + 8}
                textAnchor={anchor}
                dominantBaseline="middle"
                style={{
                  fontFamily: 'var(--font-display)',
                  fontSize: 14,
                  fontWeight: 600,
                  letterSpacing: '-0.005em',
                  fill: isActive ? d.color : 'var(--ink)'
                }}>
                {d.name}
              </text>
            </g>);
        })}

        {/* central hub */}
        <circle cx={cx} cy={cy} r={rInner} fill="var(--paper)" stroke="var(--line)" strokeWidth="1" />
        <circle cx={cx} cy={cy} r={rInner - 6} fill="none" stroke="var(--brand)" strokeWidth="0.6" strokeDasharray="2 3" opacity="0.5" />
        <text x={cx} y={cy - 6} textAnchor="middle" dominantBaseline="middle"
        fill="var(--brand)"
        style={{ fontFamily: 'var(--font-display)', fontSize: 26, fontWeight: 700, letterSpacing: '-0.02em' }}>
          8D
        </text>
        <text x={cx} y={cy + 14} textAnchor="middle" dominantBaseline="middle"
        fill="var(--muted)"
        style={{ fontFamily: 'var(--font-mono)', fontSize: 8, letterSpacing: '0.22em', textTransform: 'uppercase' }}>
          METHOD
        </text>
      </svg>
    </div>);

}

  document.body.dataset.palette = t.palette;
  document.body.dataset.typo = t.typo;

<script type="text/babel">
/* global React, ReactDOM, BPC_DATA, useRoute, Nav, Footer, applyTheme,
   PageHome, PageAbout, PageMethod, PageServices, PageResults, PageContact,
   TweaksPanel, useTweaks, TweakSection, TweakRadio, TweakSelect, TweakColor */
const { useState, useEffect } = React;
const D = window.BPC_DATA;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": "purple",
  "typo": "sans",
  "hero": "editorial",
  "method": "wheel",
  "testi": "wall",
  "marquee": "scroll"
}/*EDITMODE-END*/;

function App() {
  const route = useRoute();
  const [t, setT] = useTweaks(TWEAK_DEFAULTS);
  const brand = D.brand;

  // Apply theme tokens
  useEffect(() => { applyTheme({ palette: t.palette, typo: t.typo }); }, [t.palette, t.typo]);

  // Mark body when tweaks panel is on so floating chip can show
  useEffect(() => {
    const onMsg = (e) => {
      if (e.data?.type === '__activate_edit_mode')   document.body.dataset.tweaks = 'on';
      if (e.data?.type === '__deactivate_edit_mode') document.body.dataset.tweaks = 'off';
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, []);

  let page;
  if      (route === '/about')    page = <PageAbout    brand={brand} />;
  else if (route === '/method')   page = <PageMethod   tweaks={t} brand={brand} />;
  else if (route === '/services') page = <PageServices brand={brand} />;
  else if (route === '/results')  page = <PageResults  tweaks={t} brand={brand} />;
  else if (route === '/contact')  page = <PageContact  brand={brand} />;
  else                            page = <PageHome     tweaks={t} brand={brand} />;

  return (
    <>
      <Nav route={route} brand={brand} />
      <main key={route}>{page}</main>
      <Footer brand={brand} />

      <TweaksPanel title="Tweaks" defaultOpen={false}>
        <TweakSection title="Palette">
          <TweakSelect label="Theme" value={t.palette} onChange={v => setT('palette', v)}
            options={[
              { value: 'purple',     label: 'Brand Purple (light)' },
              { value: 'deepviolet', label: 'Deep Violet (dark, logo-driven)' },
              { value: 'indigo',     label: 'Neuro Indigo' },
              { value: 'editorial',  label: 'Editorial' }
            ]}
          />
          <p className="help" style={{ fontSize: 11, color: '#666', marginTop: 6 }}>
            Brand Purple = current light. Deep Violet = dark site, the logo's purple dominates. Indigo = clinical. Editorial = black + cream.
          </p>
        </TweakSection>

        <TweakSection title="Typography">
          <TweakRadio label="Headlines" value={t.typo} onChange={v => setT('typo', v)}
            options={[
              { value: 'serif', label: 'Serif Display' },
              { value: 'sans',  label: 'All-Sans' }
            ]}
          />
        </TweakSection>

        <TweakSection title="Home Hero">
          <TweakRadio label="Variant" value={t.hero} onChange={v => setT('hero', v)}
            options={[
              { value: 'editorial', label: 'Editorial' },
              { value: 'split',     label: 'Split' },
              { value: 'kinetic',   label: 'Kinetic' }
            ]}
          />
        </TweakSection>

        <TweakSection title="Method visual">
          <TweakRadio label="On Home" value={t.method} onChange={v => setT('method', v)}
            options={[
              { value: 'wheel', label: 'Wheel' },
              { value: 'list',  label: 'Editorial' }
            ]}
          />
        </TweakSection>

        <TweakSection title="Sports marquee">
          <TweakSelect label="Animation" value={t.marquee} onChange={v => setT('marquee', v)}
            options={[
              { value: 'scroll',  label: 'Smooth scroll (default)' },
              { value: 'dual',    label: 'Two rows, opposite directions' },
              { value: 'pills',   label: 'Pill chips' },
              { value: 'rotator', label: 'Rotator — one sport at a time' },
              { value: 'ticker',  label: 'Ticker — numbered, mono' }
            ]}
          />
        </TweakSection>

        <TweakSection title="Testimonials">
          <TweakRadio label="Layout" value={t.testi} onChange={v => setT('testi', v)}
            options={[
              { value: 'wall',     label: 'Wall' },
              { value: 'carousel', label: 'Carousel' },
              { value: 'results',  label: 'Results' }
            ]}
          />
        </TweakSection>
      </TweaksPanel>

      <div className="tweak-status">Tweaks · {t.palette} / {t.typo} / {t.hero} / {t.method} / {t.testi} / {t.marquee}</div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
